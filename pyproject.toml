[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hot-money-chasing"
version = "0.1.0"
description = "A-share intraday hot-money tracking agent with AkShare/Tushare and OpenClaw reporting"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
  "akshare>=1.14.0",
  "tushare>=1.2.89",
  "pandas>=1.3.0",
  "requests>=2.31.0"
]

[project.scripts]
hot-money = "hot_money_chasing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
